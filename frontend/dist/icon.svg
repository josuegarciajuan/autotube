<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Borde sutil -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.2"/>

  <!-- Anillo exterior — automatización (línea discontinua) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#06b6d4" stroke-width="5" opacity="0.12"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGlow)" stroke-width="4" 
          stroke-dasharray="70 130" opacity="0.55" transform="rotate(-65 256 256)"/>

  <!-- Triángulo play -->
  <polygon points="172,143 172,369 372,256" fill="url(#cyan)"/>

  <!-- Brillo interno sutil del play -->
  <polygon points="182,158 182,354 352,256" fill="none" stroke="white" stroke-width="1.5" opacity="0.08"/>

  <!-- Punto de luz en el centro-derecho -->
  <polygon points="300,240 330,252 300,272" fill="white" opacity="0.06"/>
</svg>
