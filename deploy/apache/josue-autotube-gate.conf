# Autotube v2 — panel protegido por el gate de patrón universal (panel-gate).
#
# Bloque de referencia que se integra en los vhosts de josue.ink
# (/etc/apache2/sites-available/josue.ink.conf y josue.ink-le-ssl.conf).
#
# Arquitectura:
#   https://josue.ink/autotube  -> panel-gate (127.0.0.1:8099, patrón 3x3)
#                              -> FastAPI autotube (127.0.0.1:8000)
#
# El gate enruta por path (/autotube, /api, /ws) al backend BACKEND_AUTOTUBE y
# quita el prefijo /autotube antes de proxear (la SPA usa <base href="/autotube/">,
# pero la API y los assets viven en la raíz del backend).
#
# NOTA: estas directivas van DENTRO de cada <VirtualHost> de josue.ink.
#
# Exposición antigua eliminada: el panel se servía sin login en
#   https://lamami.online/autotube/  y  https://lamami.online/api/
# En /etc/apache2/sites-available/lamami.online-le-ssl.conf se retiraron los
# ProxyPass de autotube/api/media y su RewriteRule WS, y se dejó:
#   RedirectMatch 301 ^/autotube(/.*)?$ https://josue.ink/autotube$1
# Así el único acceso público pasa por el gate de patrón.

# ── Panel autotube -> gate de patrón -> backend FastAPI ──────────────────
ProxyPass /autotube http://127.0.0.1:8099/autotube
ProxyPassReverse /autotube http://127.0.0.1:8099/autotube
ProxyPass /api http://127.0.0.1:8099/api
ProxyPassReverse /api http://127.0.0.1:8099/api
ProxyPass /ws http://127.0.0.1:8099/ws
ProxyPassReverse /ws http://127.0.0.1:8099/ws

# ── Noindex del panel privado ────────────────────────────────────────────
<LocationMatch "^/autotube(/|$)">
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</LocationMatch>

# ── WebSockets de autotube: upgrade -> panel-gate (patrón) ───────────────
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/api/ws/(.*)$ ws://127.0.0.1:8099/api/ws/$1 [P,L]
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/ws/(.*)$ ws://127.0.0.1:8099/ws/$1 [P,L]
